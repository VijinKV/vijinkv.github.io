<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Cubes – games by Vijin Vincent</title>
<style>
  :root { --bg:#06021a; --card:#0f0730; --text:#e2e9ff; --muted:#9fb0e0; --cyan:#3ff6ff; --pink:#ff3fd8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.65;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 22px 72px; }
  h1 { font-size: 36px; margin: 0 0 8px; background: linear-gradient(90deg, var(--cyan), #8f7bff, var(--pink));
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid rgba(63,246,255,.22); border-radius: 16px; padding: 20px 22px; }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 { margin: 0 0 6px; font-size: 22px; color: #fff; }
  p { margin: 0 0 12px; color: var(--text); }
  .links a { margin-right: 16px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Shape Cubes</h1>
  <p class="tag">Games by Vijin Vincent</p>
  <div class="card">
    <h2>Neon Dodge</h2>
    <p>Fast glowing arcade — dodge neon shards, grab gold orbs, chain combos. Optional rewarded ads and occasional between-run interstitials; no banners.</p>
    <p class="links">
      <a href="neon-dodge/privacy-policy.html">Privacy policy</a>
      <a href="https://github.com/VijinKV/neon-dodge">Source</a>
    </p>
  </div>
  <footer>© 2026 Vijin Vincent · <a href="app-ads.txt">app-ads.txt</a></footer>
</main>
</body>
</html>
